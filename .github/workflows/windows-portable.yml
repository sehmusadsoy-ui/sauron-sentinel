name: Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 portable artifact
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
      - name: Install desktop build dependencies
        run: python -m pip install -e ".[desktop,desktop-build]"
      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $packageVersion = & python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read package version' }
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build and verify portable package
        run: python scripts/build_desktop.py
      - name: Resolve artifact directory
        id: artifacts
        shell: pwsh
        run: |
          $artifactDirectory = (Resolve-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '..\outputs')).Path
          "directory=$artifactDirectory" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify the packaged runtime with an Internet-origin marker
        shell: pwsh
        timeout-minutes: 3
        env:
          ARTIFACT_DIRECTORY: ${{ steps.artifacts.outputs.directory }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $testDirectory = Join-Path $env:RUNNER_TEMP ('sentinel-download-' + [Guid]::NewGuid().ToString('N'))
          $archive = Join-Path $env:ARTIFACT_DIRECTORY "Sauron-Sentinel-${env:PACKAGE_VERSION}-Windows-x64.zip"
          Expand-Archive -LiteralPath $archive -DestinationPath $testDirectory
          $executable = Join-Path $testDirectory 'SauronSentinel\SauronSentinel.exe'
          $marker = "[ZoneTransfer]`r`nZoneId=3`r`n"
          Set-Content -LiteralPath $executable -Stream Zone.Identifier -Value $marker -NoNewline -Encoding ascii
          if ((Get-Content -LiteralPath $executable -Stream Zone.Identifier -Raw) -cne $marker) {
            throw 'Could not verify the Internet-origin marker before launch'
          }
          $reportPath = Join-Path $testDirectory 'report.json'
          python -c "import subprocess, sys; subprocess.run([sys.argv[1], '--diagnose', sys.argv[2]], check=True, timeout=90)" $executable $reportPath
          $diagnosticExit = $LASTEXITCODE
          if ((Get-Content -LiteralPath $executable -Stream Zone.Identifier -Raw) -cne $marker) {
            throw 'The Internet-origin marker changed during diagnostics'
          }
          if ($diagnosticExit -ne 0) {
            throw 'Marked executable diagnostic command failed'
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json -AsHashtable
          if ($report.status -cne 'ok' -or $report.version -cne $env:PACKAGE_VERSION -or
              -not [object]::Equals($report.frozen, $true) -or
              -not [object]::Equals($report.collected_windows_events, $false)) {
            throw 'Marked executable diagnostics did not report a successful frozen runtime without event collection'
          }
          foreach ($check in 'resources', 'rules', 'desktop_libraries', 'instance_lock', 'loopback_http', 'sqlite', 'shutdown') {
            if (-not [object]::Equals($report.checks[$check], $true)) {
              throw "Marked executable failed the $check diagnostic check"
            }
          }
      - name: Upload package and verification manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sauron-Sentinel-${{ steps.package.outputs.version }}-Windows-x64
          path: |
            ${{ steps.artifacts.outputs.directory }}/Sauron-Sentinel-${{ steps.package.outputs.version }}-Windows-x64.zip
            ${{ steps.artifacts.outputs.directory }}/Sauron-Sentinel-${{ steps.package.outputs.version }}-Windows-x64/SHA256SUMS.txt
            ${{ steps.artifacts.outputs.directory }}/Sauron-Sentinel-${{ steps.package.outputs.version }}-Windows-x64/build-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          include-hidden-files: false
