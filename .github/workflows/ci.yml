name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Check style
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test with branch coverage
        run: python -m pytest --cov --cov-report=term-missing
      - name: Validate Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Start-Sentinel.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

  package:
    name: Build and installed-package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.6.1
          python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/sentinel-smoke
          /tmp/sentinel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/sentinel-smoke/bin/sauron-sentinel --version
          /tmp/sentinel-smoke/bin/sauron-sentinel demo --output /tmp/sentinel-demo
          /tmp/sentinel-smoke/bin/python "${{ github.workspace }}/scripts/smoke_installed.py"
